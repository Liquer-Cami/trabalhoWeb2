    <!-- Aplica o tema salvo antes do React carregar, evitando "piscar" claro/escuro -->
    <script>
      try {
        if (localStorage.getItem('equilibra-tema') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
